name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-env:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        run: pip install numpy mujoco
      # Step 1: the 13 environment checks (derivation, conservation, closed-form
      # limit, contract, determinism, random-policy return, golden trajectory).
      # numpy only, about 6 s on one core.
      - name: verify_env
        run: python verify_env.py
      # Step 2: LQR baseline, 7 checks (linearisation, DARE, gain, closed-loop). numpy only, about 5 s.
      - name: lqr
        run: python lqr.py
      # README numbers vs runs/*.json and fresh verify_env.py / lqr.py / mj_cartpole.py runs (numpy + mujoco).
      - name: readme numbers
        run: python test_readme.py

  gae:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # CPU wheel only; the project never uses CUDA.
      - name: install
        run: pip install numpy && pip install torch --index-url https://download.pytorch.org/whl/cpu
      # compute_gae against hand-computed advantages (termination, truncation,
      # last_done, lambda = 1). Exits 1 on failure.
      - name: test_gae
        run: python test_gae.py
