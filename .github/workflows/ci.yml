name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-env:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        run: pip install numpy
      # Step 1: the 13 environment checks (derivation, conservation, closed-form
      # limit, contract, determinism, random-policy return, golden trajectory).
      # numpy only, about 6 s on one core.
      - name: verify_env
        run: python verify_env.py
